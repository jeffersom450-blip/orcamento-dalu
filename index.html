<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#202020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Orçamento">
<title>Orçamento DALU</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
<link rel="icon" href="icones/icone-192.png">
<style>
/* Windows 11 dark (Fluent) - base visual dos apps pessoais do Jefferson / Maori.
   Origem: Desktop\Organizador\index.html (aprovado em 2026-09-28). */

:root{
  --mica:#202020;
  --layer:rgba(255,255,255,.028);
  --card:rgba(255,255,255,.05);
  --card-hover:rgba(255,255,255,.075);
  --card-solid:#2c2c2c;
  --stroke:rgba(255,255,255,.08);
  --stroke-strong:rgba(255,255,255,.14);
  --divider:rgba(255,255,255,.06);
  --ctl:rgba(255,255,255,.06);
  --ctl-hover:rgba(255,255,255,.09);
  --ctl-press:rgba(255,255,255,.04);
  --text:#fff;
  --text2:rgba(255,255,255,.79);
  --text3:rgba(255,255,255,.55);
  --text4:rgba(255,255,255,.36);
  --accent:#60cdff;
  --accent-fill:#4cc2ff;
  --on-accent:#000;
  --accent-bg:rgba(96,205,255,.12);
  --green:#6ccb5f; --green-bg:rgba(108,203,95,.14);
  --yellow:#fce100; --yellow-bg:rgba(252,225,0,.11);
  --red:#ff99a4; --red-bg:rgba(255,153,164,.14);
  --r:4px; --r2:8px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{
  font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  font-size:14px;line-height:1.43;color:var(--text);
  background:var(--mica);
  background-image:
    radial-gradient(1100px 620px at 8% -12%,rgba(70,115,160,.20),transparent 62%),
    radial-gradient(900px 520px at 100% -5%,rgba(125,85,150,.13),transparent 60%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:default}
.ic{width:16px;height:16px;flex:none}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:8px;border:4px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background-color:rgba(255,255,255,.3)}
::-webkit-scrollbar-track{background:transparent}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:260px minmax(0,1fr);grid-template-rows:48px minmax(0,1fr);height:100vh}
.titlebar{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:0 16px}
.brand{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text2);width:228px}
.brand .ic{width:18px;height:18px;color:var(--accent)}
.search{position:relative;width:min(520px,46vw);margin:0 auto 0 calc(50% - 388px)}
.search .ic{position:absolute;right:10px;top:8px;color:var(--text3);pointer-events:none}
.search input{width:100%;height:32px;padding:0 34px 0 12px;background:var(--ctl);border:1px solid var(--stroke);border-bottom-color:rgba(255,255,255,.4);border-radius:var(--r);outline:none}
.search input:hover{background:var(--ctl-hover)}
.search input:focus{background:rgba(30,30,30,.85);border-bottom-color:transparent;box-shadow:inset 0 -2px 0 var(--accent)}
.search input::placeholder{color:var(--text3)}

.nav{display:flex;flex-direction:column;gap:2px;padding:4px 8px 12px;overflow:auto}
.nav-item{position:relative;display:flex;align-items:center;gap:14px;height:38px;padding:0 12px;border:0;border-radius:var(--r);background:transparent;text-align:left;color:var(--text)}
.nav-item:hover{background:var(--ctl)}
.nav-item:active{background:var(--ctl-press)}
.nav-item.on{background:var(--ctl-hover)}
.nav-item.on::before{content:"";position:absolute;left:0;top:11px;width:3px;height:16px;border-radius:2px;background:var(--accent)}
.nav-item .lbl{flex:1}
.nav-item .count{font-size:12px;color:var(--text3);min-width:20px;text-align:center}
.nav-item .count.alert{background:#c42b1c;color:#fff;border-radius:10px;padding:0 6px;line-height:18px}
.nav-sep{height:1px;background:var(--divider);margin:8px 4px}
.nav-spacer{flex:1}

.content{background:var(--layer);border:1px solid var(--stroke);border-right:0;border-bottom:0;border-top-left-radius:var(--r2);overflow:auto;padding:28px 40px 80px}
.content-inner{max-width:1240px;margin:0 auto}

/* ---------- typography / heads ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
h1{font-family:"Segoe UI Variable Display","Segoe UI",sans-serif;font-size:28px;font-weight:600;margin:0;line-height:1.2}
.lead{margin:4px 0 0;color:var(--text3)}
h2.sec{font-family:"Segoe UI Variable Display","Segoe UI",sans-serif;font-size:18px;font-weight:600;margin:28px 0 10px;display:flex;align-items:center;gap:10px}
h2.sec .n{font-size:12px;font-weight:400;color:var(--text3)}
.head-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:32px;padding:0 12px;border-radius:var(--r);background:var(--ctl);border:1px solid var(--stroke);border-bottom-color:rgba(255,255,255,.05);color:var(--text);white-space:nowrap}
.btn:hover{background:var(--ctl-hover)}
.btn:active{background:var(--ctl-press);color:var(--text2)}
.btn.accent{background:var(--accent-fill);border-color:rgba(255,255,255,.08);border-bottom-color:rgba(0,0,0,.14);color:var(--on-accent)}
.btn.accent:hover{background:#47b1e8}
.btn.accent:active{background:#42a1d2;color:rgba(0,0,0,.6)}
.btn.danger{background:#c42b1c;border-color:transparent;color:#fff}
.btn.danger:hover{background:#b0271a}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.subtle{background:transparent;border-color:transparent}
.btn.subtle:hover{background:var(--ctl)}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:var(--r);border:0;background:transparent;color:var(--text2);text-decoration:none}
.icon-btn:hover{background:var(--ctl-hover);color:var(--text)}
.icon-btn.danger:hover{color:var(--red)}

.seg{display:inline-flex;gap:2px;padding:2px;border-radius:6px;background:rgba(0,0,0,.18);border:1px solid var(--stroke)}
.seg button{display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 12px;border:0;border-radius:var(--r);background:transparent;color:var(--text2);position:relative}
.seg button:hover{background:var(--ctl);color:var(--text)}
.seg button.on{background:var(--ctl-hover);color:var(--text)}
.seg button.on::after{content:"";position:absolute;left:50%;bottom:2px;width:16px;height:3px;margin-left:-8px;border-radius:2px;background:var(--accent)}

.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px;flex-wrap:wrap}
.toolbar .grp{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--text3)}
.small{font-size:12px}

.check{width:20px;height:20px;flex:none;display:inline-flex;align-items:center;justify-content:center;padding:0;border-radius:var(--r);border:1px solid rgba(255,255,255,.6);background:rgba(0,0,0,.1)}
.check:hover{background:rgba(255,255,255,.06)}
.check .ic{width:13px;height:13px;stroke-width:2.2}
.check.on{background:var(--accent-fill);border-color:var(--accent-fill);color:#000}
.check.on:hover{background:#47b1e8}
.check.locked{border-style:dashed;border-color:rgba(255,255,255,.35);color:var(--text4)}
.check.locked .ic{width:11px;height:11px;stroke-width:1.8}

/* ---------- cards / stats ---------- */
.card{background:var(--card);border:1px solid var(--stroke);border-radius:var(--r2);overflow:hidden}
.card.empty{padding:40px 24px;text-align:center;color:var(--text3)}
.card.empty .btn{margin-top:14px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:24px}
.stat{background:var(--card);border:1px solid var(--stroke);border-radius:var(--r2);padding:14px 18px}
.stat-l{font-size:12px;color:var(--text3)}
.stat-v{font-family:"Segoe UI Variable Display","Segoe UI",sans-serif;font-size:26px;font-weight:600;margin:2px 0;font-variant-numeric:tabular-nums}
.stat-s{font-size:12px;color:var(--text3)}
.stat.green .stat-v{color:var(--green)}
.stat.accent .stat-v{color:var(--accent)}

.badge{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:11px;font-size:12px;white-space:nowrap;background:var(--ctl);color:var(--text2)}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.nodot::before{display:none}
.badge .ic{width:12px;height:12px}
.badge.green{background:var(--green-bg);color:var(--green)}
.badge.yellow{background:var(--yellow-bg);color:var(--yellow)}
.badge.red{background:var(--red-bg);color:var(--red)}
.badge.accent{background:var(--accent-bg);color:var(--accent)}
.legend{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--text3)}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.chip{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:10px;font-size:12px;background:var(--ctl);color:var(--text2);max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.chip .ic{width:12px;height:12px}
.chip.lock{background:var(--yellow-bg);color:var(--yellow)}
.chip.ok{background:var(--green-bg);color:var(--green)}

/* ---------- tabela ---------- */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;font-weight:400;color:var(--text3);text-align:left;padding:10px 12px;border-bottom:1px solid var(--divider);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--divider);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:var(--card-hover)}
.tbl .cb{width:44px;padding-left:16px}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .strong{font-weight:600}
.tbl .nowrap{white-space:nowrap}
.tbl .act{width:120px;text-align:right;padding-right:10px}
.tbl tr.done .title-btn{color:var(--text3);text-decoration:line-through}
.tbl tr.done .num{color:var(--text3)}
.title-btn{border:0;background:none;padding:0;text-align:left;color:var(--text);font-weight:500}
.title-btn:hover{color:var(--accent)}
.sub{font-size:12px;color:var(--text3);margin-top:1px}
.row-actions{display:inline-flex;gap:2px;justify-content:flex-end}
.row-actions .hov{opacity:0}
tr:hover .row-actions .hov,.trow:hover .row-actions .hov,.row-actions .hov:focus-visible{opacity:1}

/* ---------- infobar / linhas ---------- */
.infobar{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;border-radius:var(--r);border:1px solid var(--stroke);background:#433519;margin-bottom:20px}
.infobar>.ic{color:var(--yellow)}
.infobar span{flex:1}
.infobar.err{background:#442726}
.infobar.err>.ic{color:var(--red)}
.trash-row{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 12px 10px 16px;border-bottom:1px solid var(--divider)}
.trash-row:last-child{border-bottom:0}
.trash-row:hover{background:var(--card-hover)}
.trash-row>.ic{color:var(--text3)}

/* ---------- dialog ---------- */
dialog{background:#2b2b2b;color:var(--text);border:1px solid rgba(255,255,255,.1);border-radius:var(--r2);padding:0;width:min(600px,94vw);max-height:92vh;box-shadow:0 32px 64px rgba(0,0,0,.37),0 2px 21px rgba(0,0,0,.37)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form{display:flex;flex-direction:column;max-height:92vh;margin:0}
.dlg-body{padding:24px 24px 8px;overflow:auto}
.dlg-body h2{font-family:"Segoe UI Variable Display","Segoe UI",sans-serif;font-size:20px;font-weight:600;margin:0 0 18px}
.dlg-text{margin:0 0 16px;color:var(--text2)}
.dlg-foot{display:flex;gap:8px;padding:20px 24px;background:#202020;border-top:1px solid var(--stroke)}
.dlg-foot .btn{flex:1}
.dlg-error{background:#442726;border:1px solid var(--stroke);border-radius:var(--r);padding:8px 12px;margin:0 0 14px;color:#ffd1d5;font-size:13px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.field>label{font-size:13px;color:var(--text2)}
.field>label small{color:var(--text3);margin-left:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.inp,.field input:not([type=checkbox]),.field select,.field textarea{width:100%;min-height:32px;padding:5px 10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-bottom-color:rgba(255,255,255,.5);border-radius:var(--r);outline:none}
.field textarea{resize:vertical;line-height:1.4}
.field input:hover,.field select:hover,.field textarea:hover{background:rgba(255,255,255,.085)}
.field input:focus,.field select:focus,.field textarea:focus,.inp:focus{background:#1f1f1f;border-bottom-color:transparent;box-shadow:inset 0 -2px 0 var(--accent)}
.field select option{background:#2b2b2b}
.out{display:flex;align-items:center;min-height:32px;font-weight:600;font-variant-numeric:tabular-nums}
.picker{border:1px solid var(--stroke);border-radius:var(--r);background:rgba(0,0,0,.14)}
.picker .inp{border:0;border-bottom:1px solid var(--divider);border-radius:var(--r) var(--r) 0 0;background:transparent}
.pick-list{max-height:170px;overflow:auto;padding:4px}
.pick{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:var(--r);user-select:none}
.pick:hover{background:var(--ctl)}
.pick input{accent-color:var(--accent-fill);width:16px;height:16px;margin:0;flex:none}
.pick .pl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick small{color:var(--text3);white-space:nowrap}
.pick-empty{padding:10px 12px;color:var(--text3);font-size:13px;border:1px dashed var(--stroke);border-radius:var(--r)}
.set-group{padding:0 0 18px;margin-bottom:18px;border-bottom:1px solid var(--divider)}
.set-group:last-child{border-bottom:0;margin-bottom:0}
.set-group h3{font-size:14px;font-weight:600;margin:0 0 4px}
.set-group p{margin:0 0 12px;font-size:13px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- toast ---------- */
#toastHost{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:50}
.toast{display:flex;align-items:center;gap:16px;max-width:min(640px,90vw);padding:12px 12px 12px 16px;background:#2c2c2c;border:1px solid rgba(255,255,255,.1);border-radius:var(--r2);box-shadow:0 16px 32px rgba(0,0,0,.4);animation:up .18s ease-out}
.toast-btn{border:0;background:transparent;color:var(--accent);font-weight:600;padding:4px 8px;border-radius:var(--r)}
.toast-btn:hover{background:var(--ctl)}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- responsivo ---------- */
@media (max-width:980px){
  .app{grid-template-columns:56px minmax(0,1fr)}
  .nav-item .lbl,.nav-item .count,.brand span{display:none}
  .brand{width:auto}
  .search{margin:0 auto}
  .content{padding:20px 16px 60px}
  .stats{grid-template-columns:1fr}
}
/* ---------- estilos específicos deste app ---------- */
@font-face{font-family:Montserrat;font-weight:100 900;font-display:swap;src:url(fontes/montserrat.woff2) format("woff2")}
@font-face{font-family:Poppins;font-weight:700;font-display:swap;src:url(fontes/poppins-700.woff2) format("woff2")}
@font-face{font-family:Roboto;font-weight:100 900;font-display:swap;src:url(fontes/roboto.woff2) format("woff2")}
.sheet-fit{margin:0 auto;width:906px}
.sheet-shadow{box-shadow:0 12px 40px rgba(0,0,0,.45);border-radius:2px}
.content-inner.wide{max-width:none}
.doc-num{font-variant-numeric:tabular-nums}
.hint{font-size:12px;color:var(--text3);margin:10px auto 0;text-align:center}

/* ---------- folha DALU (identidade do cliente, unidades em px do layout 906x1280) ---------- */
.sheet{position:relative;width:906px;height:1280px;background:#F2EEEB;overflow:hidden;color:#3a3633;font-family:Montserrat,Arial,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact;color-scheme:light}
.sh-bg{position:absolute;left:0;top:0;width:906px;height:840px}
.sh-logo{position:absolute;left:95px;top:83px;width:199px}
.sh-logo svg{display:block;width:100%;height:auto}
.sh-title{position:absolute;left:91px;top:409px;font:700 35px/1.2 Poppins,Montserrat,Arial,sans-serif;letter-spacing:.6px;color:#fff;margin:0}
.sh-lbl{position:absolute;font-size:13px;font-weight:600;letter-spacing:1.1px;color:#fff;text-transform:uppercase}
.sh-cli{position:absolute;left:91px;top:508px;width:450px}
.sh-name{font-size:23px;font-weight:600;color:#fff;line-height:32px;min-height:32px}
.sh-addr{margin-top:4px;font-size:14.5px;line-height:21px;letter-spacing:.5px;color:#ebe7e3}
.sh-addr div{min-height:21px}
.sh-right{position:absolute;left:586px;top:354px;width:228px}
.sh-right .sh-lbl{position:static;margin-bottom:9px}
.sh-box{height:45px;border:2.5px solid #fff;border-radius:14px;display:flex;align-items:center;justify-content:center;font:400 21px Roboto,Arial,sans-serif;color:#fff;margin-bottom:20px}
.sh-pill{height:42px;border-radius:12px;background:#DD9600;display:flex;align-items:center;justify-content:center;font:700 21px Roboto,Arial,sans-serif;color:#fff;font-variant-numeric:tabular-nums}
.sh-strip{position:absolute;left:85px;top:640px;width:732px;height:32px;border-radius:8px;background:#DD9600;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14.5px;font-weight:600;letter-spacing:5.5px;text-transform:uppercase}
.sh-flow{position:absolute;left:86px;top:681px;width:730px}
.sh-items{min-height:184px;border:2px solid #3a3633;border-radius:16px;background:#F2EEEB;padding:22px 72px 22px 76px}
.it-v{display:flex;justify-content:space-between;gap:16px;font-size:13.5px;font-weight:600;letter-spacing:1.2px;line-height:20.5px;text-transform:uppercase;color:#3a3633}
.it-v .tv{display:flex;justify-content:space-between;gap:6px;width:100px;flex:none;font-variant-numeric:tabular-nums;letter-spacing:.8px}
.sh-co{margin:46px 0 0 5px;color:#1c1a18}
.sh-co h3{margin:0 0 12px;font-size:24px;font-weight:800;letter-spacing:-.7px;line-height:1.1}
.sh-co div{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;line-height:21px;letter-spacing:.2px}
.sh-co svg{width:18px;height:18px;flex:none}
.sh-foot{position:absolute;left:0;bottom:0;width:906px;height:90px;background:#DD9600;color:#fff;text-align:center;padding-top:24px;font-size:11px;font-weight:600;letter-spacing:4.6px;line-height:16px;text-transform:uppercase}

/* edição direta na folha */
.sheet .ed{font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;background:transparent;border:1px dashed transparent;border-radius:6px;outline:none;padding:0 4px;margin:0 -5px;width:calc(100% + 10px);min-width:0}
.sheet .ed:hover{border-color:rgba(221,150,0,.55)}
.sheet .ed:focus{border:1px solid #DD9600;box-shadow:0 0 0 2px rgba(221,150,0,.25);background:rgba(255,255,255,.06)}
.sheet .ed::placeholder{color:rgba(255,255,255,.32);text-transform:none;letter-spacing:.3px}
.sh-items .ed::placeholder{color:#b3aca6}
.sh-items .ed:focus{background:#fff}
.sh-box .ed,.sh-name .ed{text-align:inherit}
.sh-box .ed{text-align:center;height:36px;margin:0 8px;width:calc(100% - 16px)}
.sh-box input[type=date]{color-scheme:dark}
.sh-box .hash{margin-right:-2px}
.sh-addr .cep{display:flex;align-items:center;gap:6px}
.sh-addr .cep .ed{width:auto;flex:1;margin-left:0}
.sh-name .ed{height:32px}
.sh-addr .ed{height:21px}
.it{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;min-height:25px;font-size:13.5px;font-weight:500;letter-spacing:1.2px;text-transform:uppercase}
.it .ed{height:23px;margin:0;width:auto}
.sheet .it-s{field-sizing:content;min-width:150px;max-width:100%}
#sheet .sh-items{padding-right:40px}
.it .it-m{width:62px;text-align:right}
.it-u{height:23px;border:1px solid #d6cfc8;border-radius:6px;background:#F2EEEB;color:#3a3633;font:600 11.5px Montserrat,Arial,sans-serif;letter-spacing:.5px;padding:0 2px;outline:none}
.it-u:focus{border-color:#DD9600}
.it-u option{background:#fff;color:#222}
.it-sp{flex:1}
.it-pu{display:flex;align-items:center;gap:4px;color:#8c847d;font-size:10.5px;letter-spacing:.3px;text-transform:none;white-space:nowrap}
.it-pu .ed{width:66px;text-align:right;font-size:12px;color:#6d655e;letter-spacing:.3px}
.it-t{display:flex;align-items:center;justify-content:space-between;width:92px;flex:none;letter-spacing:.8px}
.it-t .ed{width:68px;text-align:right;letter-spacing:.8px;padding:0 2px}
.it-del{position:absolute;left:-40px;top:2px;width:22px;height:22px;border:0;border-radius:50%;background:transparent;color:#a89f97;display:flex;align-items:center;justify-content:center;opacity:0}
.it-del svg{width:13px;height:13px}
.it:hover .it-del,.it-del:focus-visible{opacity:1}
.it-del:hover{background:#e3dcd5;color:#b3261e}
.it.fixo .it-m,.it.fixo .it-pu{visibility:hidden}
.it.blank .it-u,.it.blank .it-pu{opacity:.35}
.it.blank:focus-within .it-u,.it.blank:focus-within .it-pu{opacity:1}
.sh-over{position:absolute;right:12px;top:-28px;font-size:12px;color:#b3261e;letter-spacing:0}

#printArea,#shotArea{display:none}
#shotArea{position:fixed;left:-20000px;top:0}
@page{size:A4;margin:0}
@media print{
  html,body{height:auto;background:#fff!important;background-image:none!important}
  .app,#toastHost,dialog,#prev{display:none!important}
  #printArea{display:block!important}
  #printArea .sheet{zoom:.8761;break-after:avoid}
}

/* listas */
.tbl .tipo{font-size:12px}
.mini-num{font-variant-numeric:tabular-nums;color:var(--text2)}
.tbl .act{width:150px}
.set-group .row2{margin-bottom:0}
@media (max-width:980px){.sheet-shadow{box-shadow:0 6px 20px rgba(0,0,0,.45)}}

/* ---------- celular: formulário + barra de navegação embaixo ---------- */
.lbl-s,.show-m{display:none}
.m-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.m-title{font:600 22px "Segoe UI Variable Display","Segoe UI",system-ui,sans-serif}
.m-top-act{display:flex;gap:6px;align-items:center}
.m-ed{margin-top:12px;display:flex;flex-direction:column;gap:12px}
.m-card{padding:14px 12px 2px}
.m-h{font-size:15px;font-weight:600;margin:0 0 10px}
.m-it{padding:10px 0 12px;border-top:1px solid var(--divider)}
.m-it:first-child{border-top:0;padding-top:0}
.m-it-top{display:flex;gap:4px;align-items:center}
.m-it-top .inp{flex:1;text-transform:uppercase}
.m-it-grid{display:grid;grid-template-columns:1fr 1.15fr 1fr 1.2fr;gap:6px;margin-top:6px}
.m-it-grid label{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--text3);min-width:0}
.m-it-grid .inp{padding:5px 6px;text-align:right;min-width:0}
.m-it-grid select.inp{text-align:left;padding:5px 2px}
.m-ed select option{background:#2b2b2b}
.m-it.fixo .mi-med,.m-it.fixo .mi-pu{visibility:hidden}
.m-it.blank .m-it-grid{opacity:.45}
.m-it.blank:focus-within .m-it-grid{opacity:1}
.m-it.blank [data-act=delrow]{visibility:hidden}
.m-bar{position:sticky;bottom:0;z-index:2;margin:14px -12px 0;padding:10px 12px;display:flex;align-items:center;gap:8px;background:#272727;border-top:1px solid var(--stroke)}
.m-total{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.m-total small{font-size:11px;color:var(--text3)}
.m-total b{font-size:19px;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.m-bar .btn{height:40px}
#prev{position:fixed;inset:0;z-index:40;background:#141414;overflow:auto}
.prev-bar{position:sticky;top:0;z-index:1;display:flex;gap:8px;padding:10px 8px;padding-top:calc(10px + env(safe-area-inset-top));background:#202020;border-bottom:1px solid var(--stroke)}
.prev-bar .sp{flex:1}
.prev-bar .btn{height:38px}
.prev-sheet{width:906px;margin:8px auto 24px}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;height:100vh;height:100dvh}
  .titlebar{grid-row:1;min-height:44px;padding:env(safe-area-inset-top) 12px 0}
  .brand span{display:inline}
  .search{width:auto;flex:1;margin:0}
  .content{grid-row:2;grid-column:1;border:0;border-radius:0;padding:12px 12px 0}
  .content-inner{padding-bottom:16px}
  .nav{grid-row:3;grid-column:1;flex-direction:row;gap:0;padding:4px 4px calc(4px + env(safe-area-inset-bottom));overflow:visible;background:#1b1b1b;border-top:1px solid var(--stroke)}
  .nav-item{flex:1;flex-direction:column;justify-content:center;gap:2px;height:52px;padding:0 2px}
  .nav-item .lbl,.nav-item .count,.nav-sep,.nav-spacer{display:none}
  .nav-item .lbl-s{display:block;font-size:10.5px;color:var(--text2)}
  .nav-item.on .lbl-s{color:var(--text)}
  .nav-item.on::before{left:50%;top:auto;bottom:3px;width:16px;height:3px;margin-left:-8px}
  .nav-item .ic{width:20px;height:20px}
  .page-head h1{font-size:22px}
  .inp,.field input:not([type=checkbox]),.field select{font-size:16px;min-height:40px}
  .tbl th,.tbl td{padding:9px 8px}
  .tbl .act{width:auto}
  .hide-m{display:none}
  .show-m{display:inline}
  #toastHost{bottom:84px;width:max-content;max-width:94vw}
}

/* ================= utilidades ================= */
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayISO=()=>iso(new Date());
const parseISO=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseISO(s);d.setDate(d.getDate()+n);return iso(d)};
const daysBetween=(a,b)=>Math.round((parseISO(b)-parseISO(a))/86400000);
const fmtDate=s=>{if(!s)return '—';const [y,m,d]=s.split('-');return `${d}/${m}/${y.slice(2)}`};
const fmtNum=v=>Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtQtd=v=>Number(v??0).toLocaleString('pt-BR',{maximumFractionDigits:3});
function parseMoney(s){s=String(s??'').replace(/[R$\s]/g,'');if(!s)return 0;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=parseFloat(s);return isFinite(n)?n:0}
const href=l=>/^[a-z][a-z0-9+.-]*:\/\//i.test(l)?l:'https://'+l;
const plural=(n,a,b)=>`${n} ${n===1?a:b}`;
const mesOf=s=>(s||'').slice(0,7);
const addMonth=(m,n)=>{const [y,mm]=m.split('-').map(Number);return iso(new Date(y,mm-1+n,1)).slice(0,7)};
const mesLabel=m=>{const [y,mm]=m.split('-').map(Number);const s=new Date(y,mm-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});return s[0].toUpperCase()+s.slice(1)};
const mesCurto=m=>{const [y,mm]=m.split('-');return `${['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][+mm-1]}/${y.slice(2)}`};
const fmtCPF=s=>{const d=String(s||'').replace(/\D/g,'');return d.length===11?`${d.slice(0,3)}.${d.slice(3,6)}.${d.slice(6,9)}-${d.slice(9)}`:s||''};

/* ================= componentes ================= */

// segmented control genérico: seg(valorAtual, [[valor,rótulo,ícone?]], 'acao') -> botões com data-act/data-val
const seg=(cur,opts,act)=>`<div class="seg">${opts.map(([v,l,ic])=>`<button class="${cur===v?'on':''}" data-act="${act}" data-val="${v}">${ic||''}<span>${l}</span></button>`).join('')}</div>`;
/* ================= dialogs ================= */
function openDialog({title,body,ok='Salvar',cancel='Cancelar',danger,onOk,onOpen,focus}){
  const d=document.createElement('dialog');
  d.innerHTML=`<form method="dialog"><div class="dlg-body"><h2>${esc(title)}</h2><div class="dlg-error" hidden></div>${body}</div>
    <div class="dlg-foot">${ok?`<button class="btn ${danger?'danger':'accent'}" value="ok">${esc(ok)}</button>`:''}<button class="btn" value="cancel" formnovalidate>${esc(cancel)}</button></div></form>`;
  document.body.appendChild(d);
  const form=d.querySelector('form');
  const err=m=>{const e=d.querySelector('.dlg-error');e.textContent=m;e.hidden=!m;if(m)d.querySelector('.dlg-body').scrollTop=0};
  form.addEventListener('submit',e=>{if(e.submitter?.value==='ok'||!e.submitter){e.preventDefault();if(onOk?.(form,err)!==false)d.close('ok')}});
  d.addEventListener('close',()=>d.remove());
  d.querySelectorAll('.picker .inp').forEach(inp=>{
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')e.preventDefault()});
    inp.addEventListener('input',()=>{const q=norm(inp.value);inp.nextElementSibling.querySelectorAll('.pick').forEach(l=>l.hidden=!l.dataset.s.includes(q))});
  });
  onOpen?.(d,form);
  d.showModal();
  ((focus&&d.querySelector(focus))||d.querySelector('input:not([type=checkbox]):not([type=hidden]),textarea'))?.focus();
  return d;
}
function confirmDlg(title,msg,ok,danger){
  return new Promise(res=>{let v=false;const d=openDialog({title,body:`<p class="dlg-text">${msg}</p>`,ok,danger,onOk:()=>{v=true}});d.addEventListener('close',()=>res(v))});
}
function picker(name,items,selected){
  if(!items.length)return `<div class="pick-empty">Nenhum item disponível.</div>`;
  items=[...items].sort((a,b)=>selected.includes(b.id)-selected.includes(a.id));
  return `<div class="picker">${items.length>5?`<input class="inp" placeholder="Filtrar…">`:''}<div class="pick-list">${items.map(i=>`<label class="pick" data-s="${esc(norm(i.label))}"><input type="checkbox" name="${name}" value="${i.id}" ${selected.includes(i.id)?'checked':''}><span class="pl">${esc(i.label)}</span><small>${esc(i.sub||'')}</small></label>`).join('')}</div></div>`;
}

/* ================= toast ================= */
let toastTimer;
function toast(msg,action){
  const h=$('#toastHost');
  h.innerHTML=`<div class="toast"><span>${esc(msg)}</span>${action?`<button class="toast-btn">${esc(action.label)}</button>`:''}</div>`;
  if(action)h.querySelector('.toast-btn').onclick=()=>{h.innerHTML='';action.fn()};
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>h.innerHTML='',action?7000:4500);
}

function load(){try{const r=JSON.parse(localStorage.getItem(KEY));if(r)return {...structuredClone(DEF),...r,cfg:{...CFG_DEF,...r.cfg},ui:{...DEF.ui,...r.ui}}}catch(e){storageOK=false}return structuredClone(DEF)}

let saveT;
function saveSoon(){clearTimeout(saveT);saveT=setTimeout(persist,250)}
const hist=[];
function mutate(fn){hist.push(JSON.stringify(S));if(hist.length>60)hist.shift();fn();persist();render()}
function undo(){if(!hist.length){toast('Nada para desfazer');return}S=JSON.parse(hist.pop());persist();render();toast('Ação desfeita')}

/* ================= regras do orçamento ================= */
const UNIDS=[['MT','MT'],['CM','CM'],['M²','M²'],['UN','UN'],['BARRAS','BARRAS'],['','valor fechado']];
const r2=v=>Math.round((v+Number.EPSILON)*100)/100;
const qtyOf=it=>parseFloat(String(it.med||'').replace(/\s/g,'').replace(/[:,]/g,'.'))||0;
const normMed=s=>String(s||'').trim().replace(/[.:]/g,',');
const hasContent=it=>!!(String(it.servico||'').trim()||it.total);
const blankItem=()=>({id:uid(),servico:'',med:'',unid:'MT',pu:0,total:0});
const totalOf=d=>r2(d.itens.reduce((s,i)=>s+(+i.total||0),0));
const isEmptyDoc=d=>!d.cliente.trim()&&!d.endereco.trim()&&!d.itens.some(hasContent);
const curDoc=()=>S.docs.find(d=>d.id===S.cur);
const tipoNome=d=>d.tipo==='rec'?'Recibo':'Orçamento';
const fmtBR=s=>{if(!s)return '';const [y,m,d]=s.split('-');return `${d}/${m}/${y}`};
const keyOf=s=>norm(s).trim().replace(/\s+/g,' ');

function label(it){
  const n=String(it.servico||'').trim(),q=normMed(it.med),u=it.unid;
  if(!u||!q)return n;
  if(u==='UN')return qtyOf(it)===1?n:`${n} ${q} UN`;
  if(u==='BARRAS')return `${n} ${q} ${qtyOf(it)===1?'BARRA':'BARRAS'}`;
  return `${n} ${q}${u}`;
}
// número: AA + sequência de 3 dígitos (26010, 26011…), recomeça a cada ano
function nextNum(){
  const yy=String(new Date().getFullYear()).slice(2);
  const seqOf=n=>String(n||'').length===5&&String(n).startsWith(yy)?+String(n).slice(2)||0:0;
  const max=Math.max(seqOf(S.cfg.ultimo),...S.docs.map(d=>seqOf(d.num)));
  return yy+String(max+1).padStart(3,'0');
}
function newDoc(tipo='orc'){
  return {id:uid(),tipo,num:nextNum(),data:todayISO(),cliente:'',endereco:'',cep:'',cidade:'',itens:[blankItem()],criado:Date.now(),alterado:Date.now()};
}
// descarta folhas vazias ao trocar de documento, para não queimar número
// ao abrir o app, uma folha ainda vazia ganha a data de hoje e o próximo número livre
function freshenOnStart(){const d=curDoc();if(d&&isEmptyDoc(d)){S.docs=S.docs.filter(x=>x!==d);d.num=nextNum();d.data=todayISO();S.docs.push(d)}}
function dropIfEmpty(){const d=curDoc();if(d&&isEmptyDoc(d))S.docs=S.docs.filter(x=>x!==d)}
function ensureDoc(){
  let d=curDoc();
  if(!d){d=newDoc();S.docs.push(d);S.cur=d.id}
  if(!d.itens.length||hasContent(d.itens[d.itens.length-1]))d.itens.push(blankItem());
  return d;
}

/* aprendizado: serviços e clientes ficam salvos para selecionar depois */
function learnItem(it){
  const nome=String(it.servico||'').trim().toUpperCase();if(!nome)return;
  let s=S.servicos.find(x=>keyOf(x.nome)===keyOf(nome));
  if(!s){s={id:uid(),nome,unid:it.unid,preco:0,usos:0};S.servicos.push(s)}
  s.unid=it.unid;if(+it.pu>0)s.preco=r2(+it.pu);
  s.usos=(s.usos||0)+1;
}
function learnClient(d){
  const nome=d.cliente.trim();if(!nome)return;
  let c=S.clientes.find(x=>keyOf(x.nome)===keyOf(nome));
  if(!c){c={id:uid(),nome,usos:0};S.clientes.push(c)}
  Object.assign(c,{endereco:d.endereco.trim(),cep:d.cep.trim(),cidade:d.cidade.trim()});
  c.usos=(c.usos||0)+1;
}
function learnAll(d){d=d||curDoc();if(!d)return;d.itens.filter(hasContent).forEach(learnItem);learnClient(d);persist();fillLists()}
function fillLists(){
  const by=(a,b)=>(b.usos||0)-(a.usos||0)||a.nome.localeCompare(b.nome);
  $('#dl-serv').innerHTML=[...S.servicos].sort(by).map(s=>`<option value="${esc(s.nome)}">${s.preco?esc((s.unid?`R$ ${fmtNum(s.preco)} / ${s.unid}`:`R$ ${fmtNum(s.preco)}`)):''}</option>`).join('');
  $('#dl-cli').innerHTML=[...S.clientes].sort(by).map(c=>`<option value="${esc(c.nome)}">${esc(c.endereco||'')}</option>`).join('');
}

function itemRow(it){
  const fixo=!it.unid;
  return `<div class="it ${fixo?'fixo':''} ${hasContent(it)?'':'blank'}" data-row="${it.id}">
    <button class="it-del" data-act="delrow" title="Remover linha" tabindex="-1">${I.close}</button>
    <input class="ed it-s" data-k="servico" list="dl-serv" value="${esc(it.servico)}" placeholder="Serviço" autocomplete="off" size="${Math.max(12,String(it.servico).length+1)}">
    <input class="ed it-m" data-k="med" inputmode="decimal" value="${esc(it.med)}" placeholder="0,00" autocomplete="off">
    <select class="it-u" data-k="unid" title="Unidade">${UNIDS.map(([v,l])=>`<option value="${v}" ${it.unid===v?'selected':''}>${l}</option>`).join('')}</select>
    <span class="it-sp"></span>
    <span class="it-pu" title="Preço por unidade (não aparece na folha impressa)">R$/<span data-pu-u>${esc(it.unid||'un')}</span> <input class="ed" data-k="pu" inputmode="decimal" value="${it.pu?fmtNum(it.pu):''}" placeholder="0,00" autocomplete="off"></span>
    <span class="it-t">R$ <input class="ed" data-k="total" inputmode="decimal" value="${it.total?fmtNum(it.total):''}" placeholder="0,00" autocomplete="off"></span>
  </div>`;
}
function sheetHTML(d,ed){
  const C=S.cfg,rec=d.tipo==='rec';
  const inp=(k,ph,x='')=>`<input class="ed" data-f="${k}" value="${esc(d[k])}" placeholder="${ph}" autocomplete="off" ${x}>`;
  const addr=ed
    ?`<div>${inp('endereco','Endereço (rua, nº, bairro)')}</div><div class="cep">Cep ${inp('cep','00000-000','inputmode="numeric"')}</div><div>${inp('cidade',esc(C.cidadePadrao))}</div>`
    :[d.endereco,d.cep&&'Cep '+d.cep,d.cidade||(d.endereco&&C.cidadePadrao)].filter(Boolean).map(l=>`<div>${esc(l)}</div>`).join('');
  const itens=ed?d.itens.map(itemRow).join('')
    :d.itens.filter(hasContent).map(i=>`<div class="it-v"><span>${esc(label(i))}</span><span class="tv"><span>R$</span><span>${fmtNum(i.total)}</span></span></div>`).join('');
  return `<div class="sheet">${BG_SVG}
    <div class="sh-logo">${logo()}</div>
    <h1 class="sh-title">${rec?'RECIBO':'ORÇAMENTO'}</h1>
    <div class="sh-lbl" style="left:91px;top:476px">${rec?'Dados do contratante:':'Dados do cliente:'}</div>
    <div class="sh-cli cli-block"><div class="sh-name">${ed?inp('cliente','Nome do cliente','list="dl-cli"'):esc(d.cliente)}</div><div class="sh-addr">${addr}</div></div>
    <div class="sh-right">
      <div class="sh-lbl">Nº</div><div class="sh-box"><span class="hash">#</span>${ed?inp('num','','inputmode="numeric" style="field-sizing:content;width:auto;min-width:70px;margin:0"'):esc(d.num)}</div>
      <div class="sh-lbl">Data:</div><div class="sh-box">${ed?`<input class="ed" type="date" data-f="data" value="${esc(d.data)}" style="width:170px">`:fmtBR(d.data)}</div>
      <div class="sh-lbl">Valor do serviço</div><div class="sh-pill" ${ed?'data-pill':''}>${BRL.format(totalOf(d))}</div>
    </div>
    <div class="sh-strip">${rec?'Descrição dos serviços prestados:':'Descrição dos serviços'}</div>
    <div class="sh-flow">
      <div class="sh-items" ${ed?'id="items"':''}>${itens}</div>
      <div class="sh-co"><h3>${esc(C.nome)}</h3>
        ${C.email?`<div>${ICO.mail}${esc(C.email)}</div>`:''}${C.fone?`<div>${ICO.zap}${esc(C.fone)}</div>`:''}${C.insta?`<div>${ICO.insta}${esc(C.insta)}</div>`:''}</div>
    </div>
    <div class="sh-foot">${esc(C.rodape1)}<br>${esc(C.rodape2)}</div>
  </div>`;
}

function backupBar(){
  if(!storageOK)return `<div class="infobar err">${I.warn}<span>Não foi possível salvar neste navegador. Faça um backup para não perder nada.</span></div>`;
  const old=!S.lastBackup||Date.now()-S.lastBackup>30*864e5;
  return S.docs.filter(d=>!isEmptyDoc(d)).length>=5&&old?`<div class="infobar">${I.warn}<span>Os dados ficam só neste aparelho. Faça um backup de vez em quando.</span><button class="btn" data-act="backup">${I.save}<span>Fazer backup</span></button></div>`:'';
}

  o.innerHTML=`<div class="prev-bar"><button class="btn" data-act="close-prev">${I.close}<span>Fechar</span></button><span class="sp"></span>
    <button class="btn" data-act="print">${I.pdf}<span>PDF</span></button><button class="btn accent" data-act="img">${I.image}<span>Enviar</span></button></div>

function viewHistorico(){
  const q=norm($('#q')?.value||'');
  const list=S.docs.filter(d=>!isEmptyDoc(d)||d.id===S.cur).filter(d=>!q||norm(`${d.num} ${d.cliente} ${d.endereco} ${tipoNome(d)} ${d.itens.map(i=>i.servico).join(' ')}`).includes(q))
    .sort((a,b)=>String(b.num).localeCompare(String(a.num),undefined,{numeric:true})||b.alterado-a.alterado);
  return `<div class="page-head"><div><h1>Orçamentos e recibos</h1><p class="lead">${plural(list.length,'documento','documentos')}</p></div>
    <div class="head-actions"><button class="btn accent" data-act="novo">${I.plus}<span>Novo orçamento</span></button></div></div>
  ${backupBar()}
  ${list.length?`<div class="card"><table class="tbl"><thead><tr><th>Nº</th><th class="hide-m">Tipo</th><th>Cliente</th><th class="hide-m">Data</th><th class="num">Total</th><th class="act"></th></tr></thead><tbody>
    ${list.map(d=>`<tr><td class="mini-num">#${esc(d.num)}</td><td class="hide-m"><span class="badge ${d.tipo==='rec'?'green':'accent'}">${tipoNome(d)}</span></td>
      <td><button class="title-btn" data-act="abrir" data-id="${d.id}">${esc(d.cliente||'(sem nome)')}</button><div class="sub"><span class="show-m">${tipoNome(d)} · ${fmtBR(d.data)} </span>${esc(d.endereco||'')}</div></td>
      <td class="nowrap hide-m">${fmtBR(d.data)}</td><td class="num strong">${BRL.format(totalOf(d))}</td>
      <td class="act"><span class="row-actions"><button class="icon-btn" data-act="abrir" data-id="${d.id}" title="Abrir">${I.open}</button><button class="icon-btn" data-act="dup" data-id="${d.id}" title="Duplicar">${I.copy}</button><button class="icon-btn danger" data-act="deldoc" data-id="${d.id}" title="Excluir">${I.trash}</button></span></td></tr>`).join('')}
  </tbody></table></div>`:empty('Nenhum documento encontrado.')}`;
}
function viewServicos(){
  const q=norm($('#q')?.value||'');
  const list=S.servicos.filter(s=>!q||norm(s.nome).includes(q)).sort((a,b)=>a.nome.localeCompare(b.nome));
  return `<div class="page-head"><div><h1>Serviços salvos</h1><p class="lead">Aparecem na lista ao preencher. O preço é sugerido e sempre pode ser mudado na folha; ele se atualiza com o último valor usado.</p></div>
    <div class="head-actions"><button class="btn accent" data-act="serv-novo">${I.plus}<span>Novo serviço</span></button></div></div>
  ${list.length?`<div class="card"><table class="tbl"><thead><tr><th>Serviço</th><th class="hide-m">Unidade</th><th class="num">Preço sugerido</th><th class="num hide-m">Usos</th><th class="act"></th></tr></thead><tbody>
    ${list.map(s=>`<tr><td><button class="title-btn" data-act="serv-edit" data-id="${s.id}">${esc(s.nome)}</button></td><td class="hide-m">${esc(s.unid||'valor fechado')}</td>
      <td class="num">${s.preco?BRL.format(s.preco):'—'}<span class="show-m muted"> /${esc(s.unid||'fechado')}</span></td><td class="num muted hide-m">${s.usos||0}</td>
      <td class="act"><span class="row-actions"><button class="icon-btn" data-act="serv-edit" data-id="${s.id}" title="Editar">${I.edit}</button><button class="icon-btn danger" data-act="serv-del" data-id="${s.id}" title="Excluir">${I.trash}</button></span></td></tr>`).join('')}
  </tbody></table></div>`:empty('Nenhum serviço salvo.')}`;
}
function viewClientes(){
  const q=norm($('#q')?.value||'');
  const list=S.clientes.filter(c=>!q||norm(`${c.nome} ${c.endereco} ${c.cidade}`).includes(q)).sort((a,b)=>a.nome.localeCompare(b.nome));
  return `<div class="page-head"><div><h1>Clientes salvos</h1><p class="lead">Ao escolher um cliente na folha, o endereço vem junto.</p></div>
    <div class="head-actions"><button class="btn accent" data-act="cli-novo">${I.plus}<span>Novo cliente</span></button></div></div>
  ${list.length?`<div class="card"><table class="tbl"><thead><tr><th>Cliente</th><th class="hide-m">Endereço</th><th class="hide-m">CEP</th><th class="act"></th></tr></thead><tbody>
    ${list.map(c=>`<tr><td><button class="title-btn" data-act="cli-edit" data-id="${c.id}">${esc(c.nome)}</button><div class="sub"><span class="show-m">${esc(c.endereco||'')} </span>${esc(c.cidade||'')}</div></td><td class="hide-m">${esc(c.endereco||'—')}</td><td class="nowrap hide-m">${esc(c.cep||'')}</td>
      <td class="act"><span class="row-actions"><button class="icon-btn" data-act="cli-edit" data-id="${c.id}" title="Editar">${I.edit}</button><button class="icon-btn danger" data-act="cli-del" data-id="${c.id}" title="Excluir">${I.trash}</button></span></td></tr>`).join('')}
  </tbody></table></div>`:empty('Nenhum cliente salvo.')}`;

  $('#searchBox').innerHTML=`<input id="q" type="search" placeholder="Pesquisar   (Ctrl+F)" autocomplete="off">${I.search}`;

function renderNav(){

function render(){
  renderNav();fillLists();
  const v={editor:viewEditor,historico:viewHistorico,servicos:viewServicos,clientes:viewClientes}[S.ui.view]||viewEditor;
  $('#content').innerHTML=`<div class="content-inner ${S.ui.view==='editor'?'wide':''}">${v()}</div>`;
  $('#searchBox').style.visibility=S.ui.view==='editor'?'hidden':'';

  fit();
}
function fit(){
  const f=$('#fit');if(f)f.style.zoom=Math.min(1,f.parentElement.clientWidth/906);
  const p=$('#prev .prev-sheet');if(p)p.style.zoom=Math.min(1,($('#prev').clientWidth-16)/906);
}
// celular e computador têm telas de edição diferentes: troca ao cruzar a largura
let renderedMobile;
const onResize=()=>{if(S.ui.view==='editor'&&isMobile()!==renderedMobile)render();else fit()};
matchMedia('(max-width:760px)').addEventListener('change',onResize);
addEventListener('resize',onResize);

/* ================= edição na folha ================= */
function rowItem(el){const r=el.closest('[data-row]');const d=curDoc();return r&&d?[r,d.itens.find(i=>i.id===r.dataset.row)]:[]}
function setVal(r,k,v){const i=r.querySelector(`[data-k="${k}"]`);if(i&&i!==document.activeElement)i.value=v}
function refreshRow(r,it){
  setVal(r,'total',it.total?fmtNum(it.total):'');
  setVal(r,'pu',it.pu?fmtNum(it.pu):'');
  r.classList.toggle('fixo',!it.unid);
  r.classList.toggle('blank',!hasContent(it));
  r.querySelector('[data-pu-u]').textContent=it.unid||'un';
}
function recalc(it){if(it.unid){const q=qtyOf(it);if(q>0&&+it.pu>0)it.total=r2(q*it.pu)}else it.pu=it.total}
function touch(d){d.alterado=Date.now();$$('[data-pill]').forEach(p=>p.textContent=BRL.format(totalOf(d)));
  const h=$('.page-head h1,.m-title');if(h)h.innerHTML=`${tipoNome(d)} <span class="doc-num">#${esc(d.num)}</span>`;
  checkOverflow();saveSoon()}
function checkOverflow(){
  const fl=$('#sheet .sh-flow');if(!fl)return;
  const over=fl.offsetTop+fl.offsetHeight>$('#sheet .sh-foot').offsetTop-12;
  let w=$('#sheet .sh-over');
  if(over&&!w){w=document.createElement('div');w.className='sh-over';w.textContent='A folha está cheia: junte itens ou use outra folha';$('#items').before(w)}
  if(!over&&w)w.remove();
}
function appendBlankIfNeeded(d){
  const last=d.itens[d.itens.length-1];
  if(last&&hasContent(last)){const b=blankItem();d.itens.push(b);$('#items').insertAdjacentHTML('beforeend',rowHTML(b))}
}
document.addEventListener('input',e=>{
  const t=e.target,d=curDoc();if(!d||!t.closest('.doc-ed'))return;
  if(t.dataset.f){d[t.dataset.f]=t.value;return touch(d)}
  const [r,it]=rowItem(t);if(!it)return;
  const k=t.dataset.k;
  if(k==='servico'){it.servico=t.value.toUpperCase();if(t.value!==it.servico){const p=t.selectionStart;t.value=it.servico;t.setSelectionRange(p,p)}
    const s=S.servicos.find(x=>keyOf(x.nome)===keyOf(it.servico));
    if(s&&(e.inputType==='insertReplacementText'||!e.inputType))applyServ(it,s,r);   // escolheu da lista
    if(!CSS.supports('field-sizing','content'))t.size=Math.max(12,t.value.length+1)}
  if(k==='med'){it.med=t.value;recalc(it)}
  if(k==='pu'){it.pu=parseMoney(t.value);recalc(it)}
  if(k==='total'){it.total=parseMoney(t.value);const q=qtyOf(it);if(!it.unid)it.pu=it.total;else if(q>0)it.pu=Math.round(it.total/q*10000)/10000}
  if(k==='unid'){it.unid=t.value;recalc(it)}
  refreshRow(r,it);appendBlankIfNeeded(d);touch(d);
});
function applyServ(it,s,r){
  it.servico=s.nome;it.unid=s.unid;if(s.preco)it.pu=s.preco;
  if(!s.unid&&s.preco)it.total=s.preco;
  recalc(it);
  const sel=r.querySelector('[data-k="unid"]');sel.value=it.unid;
  refreshRow(r,it);
  const m=r.querySelector(it.unid?'[data-k="med"]':'[data-k="total"]');setTimeout(()=>m.focus(),0);
}
document.addEventListener('change',e=>{
  const t=e.target,d=curDoc();if(!d||!t.closest('.doc-ed'))return;
  if(t.dataset.f==='cliente'){
    const c=S.clientes.find(x=>keyOf(x.nome)===keyOf(t.value));
    if(c&&!d.endereco.trim()&&!d.cep.trim()){
      Object.assign(d,{cliente:c.nome,endereco:c.endereco||'',cep:c.cep||'',cidade:c.cidade||''});
      ['cliente','endereco','cep','cidade'].forEach(k=>$(`.doc-ed [data-f="${k}"]`).value=d[k]);touch(d);
    }
    return;
  }
  const [r,it]=rowItem(t);if(!it)return;
  if(t.dataset.k==='servico'){const s=S.servicos.find(x=>keyOf(x.nome)===keyOf(it.servico));if(s&&!it.pu&&!it.total){applyServ(it,s,r);touch(d)}}
  if(t.dataset.k==='med'){it.med=normMed(it.med);t.value=it.med;saveSoon()}
  if(t.dataset.k==='pu'||t.dataset.k==='total')t.value=+it[t.dataset.k]?fmtNum(it[t.dataset.k]):'';
});
// ao sair de uma linha preenchida, o serviço vai para a lista salva
document.addEventListener('focusout',e=>{
  const t=e.target;if(!t.closest?.('.doc-ed'))return;
  const r=t.closest('[data-row]');
  if(r&&!r.contains(e.relatedTarget)){const [,it]=rowItem(t);if(it&&hasContent(it)){learnItem(it);persist();fillLists()}}
  if(t.closest('.cli-block')&&!t.closest('.cli-block').contains(e.relatedTarget)){learnClient(curDoc());persist();fillLists()}
});
document.addEventListener('keydown',e=>{
  const t=e.target;if(e.key!=='Enter'||e.isComposing||!t.closest?.('.doc-ed'))return;
  e.preventDefault();
  const row=t.closest('[data-row]');let next;
  if(row){const k=t.dataset.k,it=rowItem(t)[1];
    if(k==='servico')next=row.querySelector(it.unid?'[data-k="med"]':'[data-k="total"]');
    else if(k==='med'&&!it.total)next=row.querySelector('[data-k="total"]');
    else next=row.nextElementSibling?.querySelector('[data-k="servico"]');
  }else{const f=$$('.doc-ed .cli-block [data-f]');next=f[f.indexOf(t)+1]||$('.doc-ed [data-k="servico"]')}
  next?.focus();next?.select?.();
});

/* ================= saída: impressão e imagem ================= */
const fileName=d=>`${tipoNome(d)} ${d.num}${d.cliente.trim()?' - '+d.cliente.trim():''}`;
function printDoc(){
  const d=curDoc();learnAll(d);
  $('#printArea').innerHTML=sheetHTML(d,false);
  const t=document.title;document.title=fileName(d);
  setTimeout(()=>{window.print();document.title=t},50);
}
let h2c;
function loadH2C(){return h2c||(h2c=new Promise((ok,no)=>{const s=document.createElement('script');s.src='js/html2canvas.min.js';s.onload=()=>ok(window.html2canvas);s.onerror=()=>{h2c=null;no()};document.head.appendChild(s)}))}
async function exportImg(){
  const d=curDoc();learnAll(d);
  toast('Gerando imagem…');
  let lib;try{lib=await loadH2C()}catch(e){toast('Não deu para gerar a imagem. Use Imprimir / PDF.');return}
  const host=$('#shotArea');host.style.display='block';host.innerHTML=sheetHTML(d,false);
  await document.fonts.ready;
  try{
    const canvas=await lib(host.firstElementChild,{scale:2,backgroundColor:'#F2EEEB',logging:false});
    const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));
    const name=fileName(d)+'.png',file=new File([blob],name,{type:'image/png'});
    // no celular abre o "Compartilhar" (WhatsApp etc.); se o aparelho exigir um toque novo, o aviso traz o botão
    const share=()=>navigator.share({files:[file],title:name}).catch(err=>{if(err.name==='NotAllowedError')toast('Imagem pronta',{label:'Enviar',fn:share})});
    if(matchMedia('(pointer:coarse)').matches&&navigator.canShare?.({files:[file]}))await share();
    else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast(`Imagem salva em Downloads: ${name}`)}
  }catch(e){toast('Não deu para gerar a imagem. Use Imprimir / PDF.')}
  finally{host.innerHTML='';host.style.display='none'}
}

/* ================= diálogos ================= */
function servDialog(s){
  const n=!s;s=s||{nome:'',unid:'MT',preco:0};
  openDialog({title:n?'Novo serviço':'Editar serviço',ok:n?'Adicionar':'Salvar',
    body:`<div class="field"><label>Nome</label><input name="nome" required value="${esc(s.nome)}"></div>
    <div class="row2"><div class="field"><label>Unidade</label><select name="unid">${UNIDS.map(([v,l])=>`<option value="${v}" ${s.unid===v?'selected':''}>${l}</option>`).join('')}</select></div>
    <div class="field"><label>Preço sugerido <small>por unidade (R$)</small></label><input name="preco" inputmode="decimal" value="${s.preco?fmtNum(s.preco):''}"></div></div>`,
    onOk:(f,err)=>{const nome=f.nome.value.trim().toUpperCase();
      if(S.servicos.some(x=>x!==s&&keyOf(x.nome)===keyOf(nome))){err('Já existe um serviço com esse nome.');return false}
      mutate(()=>{const o=n?{id:uid(),usos:0}:S.servicos.find(x=>x.id===s.id);Object.assign(o,{nome,unid:f.unid.value,preco:parseMoney(f.preco.value)});if(n)S.servicos.push(o)})}});
}
function cliDialog(c){
  const n=!c;c=c||{nome:'',endereco:'',cep:'',cidade:S.cfg.cidadePadrao};
  openDialog({title:n?'Novo cliente':'Editar cliente',ok:n?'Adicionar':'Salvar',
    body:`<div class="field"><label>Nome</label><input name="nome" required value="${esc(c.nome)}"></div>
    <div class="field"><label>Endereço</label><input name="endereco" value="${esc(c.endereco)}"></div>
    <div class="row2"><div class="field"><label>CEP</label><input name="cep" value="${esc(c.cep)}"></div><div class="field"><label>Cidade</label><input name="cidade" value="${esc(c.cidade)}"></div></div>`,
    onOk:f=>mutate(()=>{const o=n?{id:uid(),usos:0}:S.clientes.find(x=>x.id===c.id);Object.assign(o,{nome:f.nome.value.trim(),endereco:f.endereco.value.trim(),cep:f.cep.value.trim(),cidade:f.cidade.value.trim()});if(n)S.clientes.push(o)})});
}
function settingsDialog(){
  const C=S.cfg,fld=(k,l,sm='')=>`<div class="field"><label>${l}${sm?` <small>${sm}</small>`:''}</label><input name="${k}" value="${esc(C[k])}"></div>`;
  openDialog({title:'Dados da empresa e backup',ok:'Salvar',
    body:`<div class="set-group"><h3>Rodapé da folha</h3><p class="muted">Aparece em todos os orçamentos e recibos.</p>
      ${fld('nome','Nome')}<div class="row2">${fld('email','E-mail')}${fld('fone','WhatsApp')}</div><div class="row2">${fld('insta','Instagram')}${fld('cidadePadrao','Cidade padrão')}</div>
      ${fld('rodape1','Faixa laranja, linha 1')}${fld('rodape2','Faixa laranja, linha 2')}</div>
    <div class="set-group"><h3>Numeração</h3><p class="muted">O próximo número é sempre o maior já usado + 1 (ano + sequência: 26010, 26011…). Se já fez folhas por fora, informe o último número usado.</p>
      ${fld('ultimo','Último número usado','próximo: '+nextNum())}</div>
    <div class="set-group"><h3>Backup</h3><p class="muted">Os dados ficam só neste navegador. Guarde o arquivo de backup no Drive/pendrive.${S.lastBackup?' Último backup: '+new Date(S.lastBackup).toLocaleDateString('pt-BR')+'.':''}</p>
      <div class="btn-row"><button type="button" class="btn" data-dlg="backup">${I.save}<span>Fazer backup</span></button><button type="button" class="btn" data-dlg="restore">${I.restore}<span>Restaurar backup</span></button></div></div>`,
    onOpen:dl=>{dl.querySelector('[data-dlg=backup]').onclick=backup;dl.querySelector('[data-dlg=restore]').onclick=()=>{dl.close();restore()}},
    onOk:f=>mutate(()=>{['nome','email','fone','insta','cidadePadrao','rodape1','rodape2','ultimo'].forEach(k=>S.cfg[k]=f[k].value.trim())})});
}
function backup(){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));
  a.download=`backup-orcamentos-dalu-${todayISO()}.json`;a.click();S.lastBackup=Date.now();persist();render();toast('Backup salvo em Downloads');
}
function restore(){
  const i=document.createElement('input');i.type='file';i.accept='.json,application/json';
  i.onchange=async()=>{try{const r=JSON.parse(await i.files[0].text());if(!Array.isArray(r.docs))throw 0;
    if(await confirmDlg('Restaurar backup?',`Substitui tudo o que está aqui por ${plural(r.docs.length,'documento','documentos')} do arquivo.`,'Restaurar'))mutate(()=>{S={...structuredClone(DEF),...r,cfg:{...CFG_DEF,...r.cfg}}})}
    catch(e){toast('Arquivo de backup inválido')}};
  i.click();
}

/* ================= eventos ================= */
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el||el.closest('dialog'))return;
  const id=el.dataset.id;
  switch(el.dataset.act){
    case 'nav':if(S.ui.view==='editor')learnAll();S.ui.view=el.dataset.view;persist();render();break;
    case 'tipo':{const d=curDoc();d.tipo=el.dataset.val;d.alterado=Date.now();persist();render();break}
    case 'novo':learnAll();mutate(()=>{dropIfEmpty();const d=newDoc();S.docs.push(d);S.cur=d.id;S.ui.view='editor'});if(!isMobile())setTimeout(()=>$('.doc-ed [data-f=cliente]')?.focus(),0);break;
    case 'dup':{const src=id?S.docs.find(d=>d.id===id):curDoc();learnAll(src);
      mutate(()=>{dropIfEmpty();const d={...structuredClone(src),id:uid(),num:nextNum(),data:todayISO(),criado:Date.now(),alterado:Date.now()};d.itens.forEach(i=>i.id=uid());S.docs.push(d);S.cur=d.id;S.ui.view='editor'});
      toast(`Cópia criada com o nº ${curDoc().num}`);break}
    case 'abrir':learnAll();mutate(()=>{if(id!==S.cur)dropIfEmpty();S.cur=id;S.ui.view='editor'});break;
    case 'deldoc':{const d=S.docs.find(x=>x.id===id);
      mutate(()=>{S.docs=S.docs.filter(x=>x.id!==id);if(S.cur===id)S.cur=null});toast(`${tipoNome(d)} #${d.num} excluído`,{label:'Desfazer',fn:undo});break}
    case 'delrow':{const d=curDoc(),r=el.closest('[data-row]');
      mutate(()=>{d.itens=d.itens.filter(i=>i.id!==r.dataset.row)});toast('Linha removida',{label:'Desfazer',fn:undo});break}
    case 'print':printDoc();break;
    case 'preview':openPreview();break;
    case 'close-prev':$('#prev')?.remove();break;
    case 'img':exportImg();break;
    case 'backup':backup();break;
    case 'settings':settingsDialog();break;
    case 'serv-novo':servDialog();break;
    case 'serv-edit':servDialog(S.servicos.find(s=>s.id===id));break;
    case 'serv-del':{const s=S.servicos.find(x=>x.id===id);mutate(()=>S.servicos=S.servicos.filter(x=>x.id!==id));toast(`${s.nome} removido da lista`,{label:'Desfazer',fn:undo});break}
    case 'cli-novo':cliDialog();break;
    case 'cli-edit':cliDialog(S.clientes.find(c=>c.id===id));break;
    case 'cli-del':{const c=S.clientes.find(x=>x.id===id);mutate(()=>S.clientes=S.clientes.filter(x=>x.id!==id));toast(`${c.nome} removido da lista`,{label:'Desfazer',fn:undo});break}
  }
});
document.addEventListener('input',e=>{if(e.target.id==='q')render(),$('#q').focus()});
document.addEventListener('keydown',e=>{
  const mod=e.ctrlKey||e.metaKey;
  if(mod&&e.key.toLowerCase()==='p'){e.preventDefault();printDoc();return}
  if(mod&&e.key.toLowerCase()==='f'&&S.ui.view!=='editor'){e.preventDefault();$('#q').focus();return}
  if(document.querySelector('dialog[open]')||e.target.matches('input,textarea,select'))return;
  if(mod&&e.key.toLowerCase()==='z'){e.preventDefault();undo()}
});
addEventListener('pagehide',()=>{learnAll();persist()});
